
<!DOCTYPE html>
<html>
<head>
    <title>My CI/CD Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #0d1520;
        }

        .container {
            padding: 100px 20px;
        }

        h1 {
            font-size: 42px;
            color: #00e5ff;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            background: #00c853;
            color: white;
            font-size: 17px;
        }

        footer {
            padding: 20px;
            background: #0d1520;
        }
    </style>
</head>

<body>

<header>
    <h2>My Jenkins Project</h2>
</header>

<div class="container">

    <h1>Welcome to Jenkins CI/CD!</h1>

    <p>
        My HTML website is deployed automatically
        using Jenkins.
    </p>

    <button>Deployment Successful</button>

</div>

<footer>
    <p>Created using Git, GitHub and Jenkins</p>
</footer>

</body>
</html>
